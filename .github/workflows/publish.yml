name: Publish

# タグを push すると JSR に publish する。
# OIDC で認証するのでトークンの管理は不要（id-token: write が必須）。
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check
      - run: deno task test
      - run: deno publish

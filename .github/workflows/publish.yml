name: Publish

# JSR に publish する。
# OIDC で認証するのでトークンの管理は不要（id-token: write が必須）。
#
# jsr.io に @chordwiki scope がまだ無いため、いまは手動実行のみ。
# scope とパッケージを作って GitHub リポジトリを紐付けたら、
# `on: push: tags: ["v*"]` に戻して Release と同時に publish する。
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check
      - run: deno task test
      - run: deno publish

name: Publish

# GitHub Release を publish すると JSR に publish する。
# JSR のバージョンは一度出すと削除できない（yank しかできない）ので、
# タグ push ではなく Release を切るという明示的な操作をトリガーにしている。
# OIDC で認証するのでトークンの管理は不要（id-token: write が必須）。
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno.json の version がタグと一致する
        run: |
          v=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "deno.json の version ($v) とタグ ($GITHUB_REF_NAME) が食い違っています"
            exit 1
          fi

      - run: deno task check
      - run: deno task test
      - run: deno publish
